# =============================================================
# tjMall-overseas 主配置（环境无关部分）
# 环境划分与 tjmall 完全一致：dev / test / beta / prod 四套 profile，
# 分别在 application-dev.yml / application-test.yml /
# application-beta.yml / application-prod.yml 中维护各自的基础设施
# 地址（infra.host）与 MySQL 环境。切换环境只改这里的 active，
# 或启动时加 --spring.profiles.active=prod / 环境变量 SPRING_PROFILES_ACTIVE。
# tjmall 的 application.yml 里 active 写的也是 beta。
# =============================================================
server:
  port: 3100 # 与 Node 版一致，Nginx 的 /api/ 反代不用动
  forward-headers-strategy: framework # 与 tjmall 一致：识别网关/反代传来的前缀

spring:
  application:
    name: tjMall-overseas
  profiles:
    active: dev
  main:
    allow-bean-definition-overriding: true
  servlet:
    # Multipart caps only gate form-file uploads. The admin upload endpoint
    # takes base64 JSON (images <= 6 MB, videos mp4/webm/mov <= 50 MB
    # decoded) and enforces its limits in OverseasAdminController, so these
    # values just need to stay comfortably above a ~68 MB base64 body.
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

# mybatis-plus（与 tjmall application.yml 同款配置）
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*Mapper.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: AUTO # 主键策略：走 DB AUTO_INCREMENT（同 tjmall）

pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true

# swagger / openapi（tjmall 用 knife4j；接口文档在 /swagger-ui.html）
springdoc:
  swagger-ui:
    path: /swagger-ui.html
knife4j:
  enable: true

# 统一日志目录（同 tjmall 习惯）
logging:
  file:
    path: ./logs
  level:
    com.zbkj.overseas: info

# 海外站自身配置（各环境可覆盖 admin-token 等）
overseas:
  # /api/admin/** 的共享口令（请求头 x-admin-token），生产环境务必用环境变量注入
  admin-token: ${ADMIN_TOKEN:}
  # 询价通知 webhook（邮件/WhatsApp 网关），为空则不通知
  rfq-webhook-url: ${RFQ_WEBHOOK_URL:}
  # 管理后台上传图片的存放目录，/uploads/** 映射到这里；放 jar 外面，重新部署不丢图
  upload-dir: ${UPLOAD_DIR:./data/uploads}
