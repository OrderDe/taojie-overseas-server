# =============================================================
# test — 测试环境（对应 tjmall 的 application-test.yml）
# tjmall test 的 MySQL：单独一个测试库 single_open_test，地址直写在 yml 里；
# 海外版同样给 test 一个独立库 taojie_overseas_test，避免污染正式数据。
# 地址默认本机，测试机不同时改 INFRA_HOST 即可。
# =============================================================
infra:
  host: ${INFRA_HOST:127.0.0.1}

spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${infra.host}:3306/taojie_overseas_test?characterEncoding=utf-8&useSSL=false&serverTimeZone=GMT+8
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    druid:
      initial-size: 1
      min-idle: 1
      max-active: 50
      max-wait: 3000
      validation-query: SELECT 1
