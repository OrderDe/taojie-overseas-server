# Copy outside the source repository and load with spring.config.additional-location.
# The service uses an existing bucket and never changes bucket ACLs.
overseas.oss.enabled=true
overseas.oss.endpoint=oss-cn-guangzhou.aliyuncs.com
overseas.oss.bucket=YOUR_BUCKET
overseas.oss.access-key-id=YOUR_ACCESS_KEY_ID
overseas.oss.access-key-secret=YOUR_ACCESS_KEY_SECRET
overseas.oss.public-url=https://YOUR_BUCKET.oss-cn-guangzhou.aliyuncs.com
overseas.oss.prefix=taojie-overseas/media/
