# Java backend runs separately; this Compose file starts only LibreTranslate.
# Run: docker compose up -d libretranslate
# Java uses LIBRETRANSLATE_URL=http://127.0.0.1:5000 on the same host.
services:
  libretranslate:
    image: libretranslate/libretranslate
    restart: unless-stopped
    environment:
      # Only the twelve site languages are loaded (source zh + eleven
      # targets) to keep model downloads and memory small.
      LT_LOAD_ONLY: "zh,en,es,fr,pt,id,ms,vi,th,ar,ru,de"
      # Set LT_API_KEYS + LT_REQUIRE_API_KEY and pass the same key to the
      # backend as LIBRETRANSLATE_API_KEY if you ever expose it beyond
      # localhost; with the loopback binding below it is optional.
      LT_API_KEYS: "${LIBRETRANSLATE_API_KEY:-}"
    ports:
      - "127.0.0.1:5000:5000"
